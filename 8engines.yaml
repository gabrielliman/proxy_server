version: 1.1
kind: operation
name: def_8engines_10gen
tags:
  - examples
  - lowmem
  - llama
  - 30parall
  - 100prog
  - rateinf
  - 8engine
queue: axia/default
component:
  kind: component
  run:
    kind: job
    connections:
      - local-scratch
    container:
      command:
        - bash
        - '-c'
        - set -x; nvidia-smi; bash 8engines.sh
      image: gabrielliman/proxy_server:latest
      resources:
        requests:
          nvidia.com/gpu: 2
          memory: 100Gi
        limits:
          nvidia.com/gpu: 2
          memory: 100Gi
      securityContext:
        capabilities:
          add:
            - SYS_RESOURCE
      workingDir: '{{ globals.artifacts_path }}/{{ globals.uuid }}/uploads'
