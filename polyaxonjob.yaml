version: 1.1
kind: operation
name: Llama-8B_benchmark
queue: nebius/default
component:
  run:
    kind: job
    connections:
      - gcs-artifacts
    container:
      args:
        - >
           ls;pwd;
           chmod +x polyaxon_benchmark.sh;
           ./polyaxon_benchmark.sh
      command:
        - /bin/bash
        - '-c'
      workingDir: "{{ globals.run_artifacts_path }}/uploads"
      image: willianjunior/vllm-0.19.0:latest
      imagePullPolicy: Always
      resources:
        requests:
          nvidia.com/gpu: '1'
        limits:
          nvidia.com/gpu: '1'
    environment:
      nodeSelector:
        polyaxon: h200
