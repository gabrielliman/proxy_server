# Arquivo polyaxon_job.yaml
version: 1.1
kind: operation
tags: [examples, bash]
queue: axia/default
name: lats_burstiness05
component:
  kind: component
  run:
    kind: job

    # Permite o uso de /scratch
    connections: [local-scratch] #, axia-artifacts]

    container:
      # Pode adicionar qualquer imagem dockerhub
      image: gabrielliman/proxy_server:latest

      # Diretório inicial: local onde foi feito os uploads
      workingDir: "{{ globals.artifacts_path }}/{{ globals.uuid }}/uploads"

      # Neste exemplo é mostrado o diretório corrente, as GPUs alocadas e o
      # storage local da axia, /scratch, que pode ser usado por qualquer
      # job ou usuário.
      # command: ["bash", "-c", "set -x; pwd; ls; ls /scratch; bash my_script.sh"]
      command: ["bash", "-c", "set -x; pwd; ls; ls /scratch; bash polyaxon_lats_benchmark.sh"]
      # command: ["bash", "-c", "set -x; pwd; ls; ls /scratch;"]
      # Defina ambos 'requests' e 'limits' para asegurar alocação exclusiva.
      resources:
        requests:
          nvidia.com/gpu: 1
        limits:
          nvidia.com/gpu: 1
